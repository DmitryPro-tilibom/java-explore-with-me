server.port: 8081
client.url: http://localhost:9090
app: ewm-main-service

spring.jpa:
hibernate.ddl-auto: none
properties.hibernate.format_sql: true
spring.sql.init:
mode: always
schema-locations: classpath:schema.sql

logging.level.org.springframework:
orm.jpa: INFO
transaction: INFO
transaction.interceptor: TRACE
orm.jpa.JpaTransactionManager: DEBUG
boot.autoconfigure.jdb: DEBUG

logging.level.org.hibernate:
SQL: DEBUG
jdbc.bind: TRACE

spring.datasource:
driver-class-name: org.postgresql.Driver
url: jdbc:postgresql://localhost:5431/main-db
username: user
password: user

logging.level.ru.practicum.emw: DEBUG